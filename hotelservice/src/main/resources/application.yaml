server:
  port: 8081

spring:
  application:
    name: hotel-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  #datasource:
  #  url: jdbc:postgresql://localhost:5432/otel_db
  #  username: app_user
  #  password: app_pass
  #  driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
