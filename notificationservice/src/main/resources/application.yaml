server:
  port: 8083

spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring:
        json:
          trusted:
            packages: "*"
      spring.json.type.mapping: com.oteller.reservationservice.service.model.ReservationCreatedEvent:com.oteller.notificationservice.model.ReservationCreatedEvent

reservation:
  kafka:
    topic: ${RESERVATION_KAFKA_TOPIC}
